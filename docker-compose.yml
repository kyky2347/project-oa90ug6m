name: pulse
services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local_only}
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    user: "${PULSE_UID:-1000}:${PULSE_GID:-1000}"
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse_local_only}@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./data:/app/data"]
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  worker:
    user: "${PULSE_UID:-1000}:${PULSE_GID:-1000}"
    profiles: ["refresh"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "pipeline.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD:-pulse_local_only}@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
      PULSE_REFRESH_INTERVAL_SECONDS: 86400
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./data:/app/data"]
volumes:
  postgres_data:
