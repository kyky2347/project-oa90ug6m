[project]
name = "pulse-data"
version = "0.1.0"
description = "Transparent London urban opportunity intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "geoalchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "tenacity>=9,<10", "beautifulsoup4>=4.13,<5",
  "polars>=1.26,<2", "numpy>=2,<3", "scipy>=1.15,<2", "statsmodels>=0.14,<1",
  "scikit-learn>=1.6,<2", "geopandas>=1,<2", "shapely>=2,<3", "h3>=4.2,<5",
  "osmium>=4,<5", "redis>=5,<7", "typer>=0.15,<1", "rich>=13,<15",
  "openpyxl>=3.1,<4", "xlrd>=2,<3", "orjson>=3.10,<4"
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "pytest-cov>=6,<8"]

[project.scripts]
pulse-data = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostGIS", "network: contacts official sources"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
